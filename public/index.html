<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KSR Foods | So Fast, So Yummy!</title>
  <meta name="description" content="Poundo flours, Ofada rice, palm oil, honey, garri and more from KSR Foods. Order on WhatsApp.">
  <meta name="theme-color" content="#0b6b3a">

  <meta property="og:type" content="website">
  <meta property="og:title" content="KSR Foods | So Fast, So Yummy!">
  <meta property="og:description" content="Quality Nigerian staples: poundo flours, rice, beans, oils, honey and garri.">
  <meta property="og:image" content="assets/images/logo.jpeg">

  <link rel="icon" href="assets/images/logo.jpeg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#shop">Skip to shop</a>

  <header class="site-header">
    <a class="brand" href="#top" aria-label="KSR Foods — home">
      <img src="assets/images/logo.jpeg" alt="" width="44" height="44">
      <span>KSR Foods</span>
    </a>
    <button
      class="cart-btn"
      id="openCart"
      type="button"
      aria-label="Open cart"
      aria-haspopup="dialog"
      aria-controls="drawer"
      aria-expanded="false">
      🛒 Cart <span id="cartCount" aria-live="polite" aria-atomic="true">0</span>
    </button>
  </header>

  <section class="hero" id="top">
    <h1>So Fast, So Yummy!</h1>
    <p>Quality Nigerian staples: poundo flours, rice, beans, oils, honey and garri.</p>
    <a class="btn" href="#shop">Shop now</a>
  </section>

  <main id="shop" class="container">
    <div class="toolbar">
      <input
        type="search"
        id="search"
        name="q"
        placeholder="Search products…"
        aria-label="Search products"
        autocomplete="off"
        spellcheck="false"
        enterkeyhint="search">
      <div class="chips" id="categories" role="group" aria-label="Filter by category"></div>
    </div>

    <div class="grid" id="products" aria-live="polite" aria-busy="true"></div>
    <ul class="notes" id="notes" aria-label="Ordering notes"></ul>

    <noscript>
      <p>
        KSR Foods needs JavaScript enabled to browse and order online.
        You can still reach us on
        <a href="https://wa.me/2348077029452">WhatsApp&nbsp;0807&nbsp;702&nbsp;9452</a>.
      </p>
    </noscript>
  </main>

  <footer class="site-footer">
    <p>
      <strong>KSR Foods</strong> |
      WhatsApp <a href="https://wa.me/2348077029452">0807 702 9452</a> |
      <a href="tel:+2348039568762">0803 956 8762</a>
    </p>
    <p>
      <a href="https://www.instagram.com/ksrfoods.ng/" target="_blank" rel="noopener">@ksrfoods.ng on Instagram</a>
    </p>
  </footer>

  <div class="overlay" id="overlay" aria-hidden="true"></div>

  <aside
    class="drawer"
    id="drawer"
    role="dialog"
    aria-label="Shopping cart">
    <div class="drawer-head">
      <h2>Your cart</h2>
      <button id="closeCart" type="button" aria-label="Close cart">✕</button>
    </div>

    <div class="drawer-body" id="cartItems" aria-live="polite"></div>

    <div class="drawer-foot">
      <div class="total">
        <span>Total</span>
        <strong id="cartTotal" aria-live="polite" aria-atomic="true">₦0</strong>
      </div>

      <input
        id="custName"
        name="name"
        placeholder="Your name"
        autocomplete="name"
        aria-label="Your name"
        required>
      <input
        id="custPhone"
        name="phone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="Phone number"
        aria-label="Phone number"
        required>
      <input
        id="custEmail"
        name="email"
        type="email"
        inputmode="email"
        autocomplete="email"
        placeholder="Email (for payment receipt)"
        aria-label="Email for payment receipt">
      <textarea
        id="custAddress"
        name="address"
        rows="2"
        autocomplete="street-address"
        placeholder="Delivery address"
        aria-label="Delivery address"></textarea>

      <button class="btn block"    id="payBtn"      type="button">Pay online (Paystack)</button>
      <button class="btn block tr" id="transferBtn" type="button">Pay by bank transfer</button>
      <button class="btn block wa" id="whatsappBtn" type="button">Order on WhatsApp instead</button>
      <small>Prices may change at the point of payment.</small>
    </div>
  </aside>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
