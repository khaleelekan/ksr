<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KSR Foods | So Fast, So Yummy!</title>
  <meta name="description" content="Poundo flours, Ofada rice, palm oil, honey, garri and more from KSR Foods. Order on WhatsApp.">
  <link rel="icon" href="assets/images/logo.jpeg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top"><img src="assets/images/logo.jpeg" alt="KSR Foods logo"><span>KSR Foods</span></a>
    <button class="cart-btn" id="openCart" aria-label="Open cart">🛒 Cart <span id="cartCount">0</span></button>
  </header>

  <section class="hero" id="top">
    <h1>So Fast, So Yummy!</h1>
    <p>Quality Nigerian staples: poundo flours, rice, beans, oils, honey and garri.</p>
    <a class="btn" href="#shop">Shop now</a>
  </section>

  <main id="shop" class="container">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search products...">
      <div class="chips" id="categories"></div>
    </div>
    <div class="grid" id="products"></div>
    <ul class="notes" id="notes"></ul>
  </main>

  <footer class="site-footer">
    <p><strong>KSR Foods</strong> | WhatsApp <a href="https://wa.me/2348077029452">0807 702 9452</a> | <a href="tel:+2348039568762">0803 956 8762</a></p>
    <p><a href="https://www.instagram.com/ksrfoods.ng/" target="_blank" rel="noopener">@ksrfoods.ng on Instagram</a></p>
  </footer>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="Shopping cart">
    <div class="drawer-head"><h2>Your cart</h2><button id="closeCart" aria-label="Close cart">✕</button></div>
    <div class="drawer-body" id="cartItems"></div>
    <div class="drawer-foot">
      <div class="total"><span>Total</span><strong id="cartTotal">₦0</strong></div>
      <input id="custName" placeholder="Your name">
      <input id="custPhone" type="tel" placeholder="Phone number">
      <input id="custEmail" type="email" placeholder="Email (for payment receipt)">
      <textarea id="custAddress" rows="2" placeholder="Delivery address"></textarea>
      <button class="btn block" id="payBtn">Pay online (Paystack)</button>
      <button class="btn block tr" id="transferBtn">Pay by bank transfer</button>
      <button class="btn block wa" id="whatsappBtn">Order on WhatsApp instead</button>
      <small>Prices may change at the point of payment.</small>
    </div>
  </aside>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
